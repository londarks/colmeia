[package]
name = "colmeia-app"
version = "0.1.0"
description = "Colmeia - orquestrador de agentes de IA em canvas infinito"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "colmeia_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
keepawake = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
base64 = "0.22"
tiny_http = "0.12"
rand = "0.8"
urlencoding = "2"
ureq = { version = "2", features = ["json"] }
# Horário local para rotinas daily/weekly (já está no Cargo.lock como dependência transitiva).
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
vt100 = "0.18"
# Portal: CDP por WebSocket síncrono em ws://127.0.0.1 (sem TLS, sem tokio).
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }

# Job Object por terminal (matar a árvore de processos do agente). Já está no Cargo.lock.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }
